<style>
:root{
  --gold:#f5b800; --gold2:#ffd84a; --black:#0b0b0c; --panel:#141416; --line:#2a2a2e; --text:#e8e6df; --mute:#9a978c;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--black);color:var(--text);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.7;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);}
a{color:inherit;text-decoration:none}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
/* nav */
nav{position:sticky;top:0;z-index:10;background:rgba(11,11,12,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:56px}
.logo{font-family:"Black Ops One","Impact",sans-serif;font-weight:400;letter-spacing:.14em;color:var(--gold);font-size:20px;text-shadow:0 0 12px rgba(245,184,0,.45)}
nav ul{display:flex;gap:22px;list-style:none;font-size:14px}
nav ul a:hover{color:var(--gold)}
@media(max-width:640px){nav ul{gap:12px;font-size:13px}.logo{font-size:14px}}
/* hero */
.hero{min-height:88vh;display:flex;align-items:center;text-align:center;position:relative;
  background:radial-gradient(ellipse at 50% 30%,rgba(245,184,0,.16),transparent 60%),var(--black)}
.hero{overflow:hidden}
.vbg{position:absolute;inset:0;z-index:0;overflow:hidden;background:#000}
.vbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,12,.55),rgba(11,11,12,.75))}
.vbg iframe{position:absolute;top:-160px;left:50%;width:max(100vw,230vh);height:calc(100% + 320px);transform:translateX(-50%);border:0;pointer-events:none}
.hero::after{z-index:2;content:"";position:absolute;left:0;right:0;bottom:0;height:14px;
  background:repeating-linear-gradient(-45deg,var(--gold) 0 18px,var(--black) 18px 36px)}
.tag{display:inline-block;border:1px solid var(--gold);color:var(--gold);padding:4px 14px;font-size:12px;letter-spacing:.3em;margin-bottom:22px}
.herologo{display:block;margin:0 auto 10px;width:min(380px,70vw);filter:drop-shadow(0 0 40px rgba(245,184,0,.35));margin-bottom:10px}
.sr{position:absolute;left:-9999px}
.hero h1{font-size:clamp(44px,11vw,104px);font-weight:900;line-height:1.05;letter-spacing:.04em}
.hero h1 span{color:var(--gold);display:block}
.hero p.sub{margin:24px auto 34px;max-width:560px;color:var(--mute);font-size:17px}
.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{padding:14px 30px;font-weight:800;letter-spacing:.08em;border:2px solid var(--gold);transition:.2s;cursor:pointer;background:none;color:var(--gold);font-size:15px;font-family:inherit}
.btn.fill{background:var(--gold);color:var(--black)}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 22px rgba(245,184,0,.45)}
/* sections */
section{padding:90px 0;position:relative;z-index:1}
h2{font-size:clamp(26px,5vw,38px);font-weight:900;margin-bottom:8px}
h2 em{font-style:normal;color:var(--gold)}
.lead{color:var(--mute);margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);padding:24px}
.card h3{color:var(--gold);margin-bottom:8px;font-size:18px}
.card p{color:#c8c5ba;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:40px;text-align:center}
.stat{border:1px solid var(--line);padding:22px 10px;background:var(--panel)}
.stat b{display:block;font-size:30px;color:var(--gold)}
.stat span{font-size:13px;color:var(--mute)}
/* ranks */
.ranks{list-style:none;counter-reset:r}
.ranks li{counter-increment:r;display:flex;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:16px 20px;margin-bottom:10px}
.ranks li::before{content:counter(r,decimal-leading-zero);font-weight:900;color:var(--gold);font-size:22px;min-width:36px}
.ranks b{display:block}
.ranks small{color:var(--mute)}
/* steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;counter-reset:s}
.step{counter-increment:s;background:var(--panel);border:1px solid var(--line);padding:24px;position:relative}
.step::before{content:counter(s);position:absolute;top:-16px;left:18px;background:var(--gold);color:var(--black);width:32px;height:32px;display:grid;place-items:center;font-weight:900}
.step h3{margin:8px 0 6px}
.step p{color:#c8c5ba;font-size:15px}
/* faq */
details{background:var(--panel);border:1px solid var(--line);padding:16px 20px;margin-bottom:10px}
summary{cursor:pointer;font-weight:700}
details p{margin-top:10px;color:#c8c5ba;font-size:15px}
/* cta */
.cta{text-align:center;background:linear-gradient(180deg,transparent,rgba(245,184,0,.1))}
.cta h2{font-size:clamp(28px,6vw,48px)}
footer{border-top:1px solid var(--line);padding:30px 0;text-align:center;color:var(--mute);font-size:13px;position:relative;z-index:1}
@media(min-width:1100px){.wrap{padding:0 48px}.card p,.step p{font-size:16px}.lead{font-size:17px}.ranks li{padding:20px 28px}details{padding:20px 28px}}
.clips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.clip{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:1px solid var(--line);border-top:3px solid var(--gold);background:#000;cursor:pointer;overflow:hidden;color:#fff}
.clip img,.clip iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;transition:.4s}
.clip:hover img{transform:scale(1.05);opacity:.8}
.clip .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(245,184,0,.92);color:var(--black);display:grid;place-items:center;font-size:24px;padding-left:4px;box-shadow:0 0 24px rgba(0,0,0,.6)}
.clip .num{position:absolute;left:12px;bottom:10px;font-size:12px;letter-spacing:.2em;font-weight:800;color:var(--gold);text-shadow:0 0 6px #000}
.typing::after{content:"▌";color:var(--gold);margin-left:2px;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.reveal{opacity:0;transform:translateY(24px);transition:.7s}
.reveal.show{opacity:1;transform:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;user-drag:none}


/* BGM 플레이어 (기본 음소거) */
(function(){
  var VID="1fWE-AqwyeI", root=document.getElementById("bgm"), btn=document.getElementById("bgm-btn"), vol=document.getElementById("bgm-vol"), player=null, ready=false, muted=true;
  function ui(){
    root.classList.toggle("on",!muted);
    btn.querySelector(".ico").textContent=muted?"🔇":"🔊";
    btn.querySelector(".txt").textContent=muted?"BGM 음소거":"BGM 재생 중";
  }
  window.onYouTubeIframeAPIReady=function(){
    player=new YT.Player("bgm-frame",{
      width:"200",height:"200",videoId:VID,
      playerVars:{autoplay:1,controls:0,loop:1,playlist:VID,playsinline:1,rel:0,disablekb:1,origin:location.origin},
      events:{
        onReady:function(e){ e.target.mute(); e.target.setVolume(+vol.value); e.target.playVideo(); ready=true; },
        onStateChange:function(e){ if(e.data===0){ e.target.playVideo(); } },
        onError:function(){ btn.querySelector(".txt").textContent="BGM 재생 불가"; }
      }
    });
  };
  function setMuted(m){
    if(!ready||!player) return;
    if(m){ player.mute(); } else { player.unMute(); player.setVolume(+vol.value); player.playVideo(); }
    muted=m; ui();
  }
  btn.addEventListener("click",function(){
    if(muted && +vol.value===0){ vol.value=60; }
    setMuted(!muted);
  });
  vol.addEventListener("input",function(){
    var v=+vol.value;
    if(!ready||!player) return;
    if(v===0){ setMuted(true); return; }
    player.setVolume(v);
    if(muted){ setMuted(false); }
  });
  var t=document.createElement("script"); t.src="https://www.youtube.com/iframe_api"; document.head.appendChild(t);
})();
/* 스크롤 시 글자 타이핑 효과 */
var TYPE_SEL=".reveal h2, .reveal .lead, .reveal .card h3, .reveal .card p, .reveal .step h3, .reveal .step p, .reveal .ranks b, .reveal .ranks small";
function typeEl(el,delay){
  var nodes=[], w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
  while(w.nextNode()){ if(w.currentNode.nodeValue.trim()){ nodes.push({n:w.currentNode,t:w.currentNode.nodeValue}); } }
  var total=0; nodes.forEach(function(x){ total+=x.t.length; });
  if(!total) return;
  el.style.minHeight=el.offsetHeight+"px";
  nodes.forEach(function(x){ x.n.nodeValue=""; });
  var step=Math.max(14,Math.min(45,1200/total)), i=0;
  function tick(){
    i++; var rem=i;
    nodes.forEach(function(x){ var k=Math.min(rem,x.t.length); x.n.nodeValue=x.t.slice(0,k); rem-=k; });
    if(i<total){ setTimeout(tick,step); } else { el.classList.remove("typing"); el.style.minHeight=""; }
  }
  setTimeout(function(){ el.classList.add("typing"); tick(); },delay);
}
function typeSection(sec){
  if(sec.dataset.typed) return; sec.dataset.typed="1";
  var list=sec.querySelectorAll(TYPE_SEL);
  list.forEach(function(el,idx){ typeEl(el,idx*120); });
}
var io = new IntersectionObserver(function(es){
  es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("show"); typeSection(e.target); } });
},{threshold:.12});
document.querySelectorAll(".reveal").forEach(function(el){ io.observe(el); });
["contextmenu","selectstart","dragstart"].forEach(function(t){
  document.addEventListener(t,function(e){e.preventDefault();});
});
</script>
